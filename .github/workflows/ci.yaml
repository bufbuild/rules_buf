name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  checkgenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin Bazel to .bazelversion
        run: echo "USE_BAZEL_VERSION=$(cat .bazelversion)" >> "$GITHUB_ENV"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Configure bazel caches
        run: |
          echo "common --disk_cache=${HOME}/.cache/bazel-disk" >> ~/.bazelrc
          echo "common --repository_cache=${HOME}/.cache/bazel-repo" >> ~/.bazelrc
      - name: Restore bazel caches
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ runner.os }}-bazel-checkgenerate-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'examples/**/MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-checkgenerate-
      - name: Lint
        run: make lint
      - name: Check generated files
        run: make checkgenerate
      # Pull requests only restore so they can't evict the caches main relies on.
      - name: Save bazel caches
        if: github.ref == 'refs/heads/main' && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin Bazel to .bazelversion
        run: echo "USE_BAZEL_VERSION=$(cat .bazelversion)" >> "$GITHUB_ENV"
      - name: Configure bazel caches
        run: |
          echo "common --disk_cache=${HOME}/.cache/bazel-disk" >> ~/.bazelrc
          echo "common --repository_cache=${HOME}/.cache/bazel-repo" >> ~/.bazelrc
      - name: Restore bazel caches
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ runner.os }}-bazel-examples-${{ hashFiles('.bazelversion', 'examples/**/MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-examples-
      - name: Build examples
        run: |
          for dir in examples/*/; do
            echo "::group::bazel build in ${dir}"
            (cd "${dir}" && bazel build //...)
            echo "::endgroup::"
          done
      - name: Build examples with proto toolchain resolution
        run: |
          for dir in examples/bzlmod/ examples/echo/; do
            echo "::group::bazel build in ${dir}"
            (cd "${dir}" && bazel build //... --incompatible_enable_proto_toolchain_resolution)
            echo "::endgroup::"
          done
      # Runs the BCR presubmit test module. BCR's sandbox leaves $HOME
      # read-only, so point HOME somewhere unwritable to match.
      - name: Test BCR test module
        working-directory: examples/bzlmod
        run: bazel test //... --test_env=HOME=/nonexistent
      # Pull requests only restore so they can't evict the caches main relies on.
      - name: Save bazel caches
        if: github.ref == 'refs/heads/main' && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
