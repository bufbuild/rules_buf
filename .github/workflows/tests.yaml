name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  # Bazelisk is included in github runners
  # NOTE: Cache path doesn't support env expansion
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["7.x", "8.x", "9.x"]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure bazel caches
        run: |
          echo "common --disk_cache=${HOME}/.cache/bazel-disk" >> ~/.bazelrc
          echo "common --repository_cache=${HOME}/.cache/bazel-repo" >> ~/.bazelrc
      - name: Restore bazel caches
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ runner.os }}-bazel-${{ matrix.bazel }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.bazel }}-
      - name: bazel test
        run: make test
      # Pull requests only restore so they can't evict the caches main relies on.
      - name: Save bazel caches
        if: github.ref == 'refs/heads/main' && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["7.x", "8.x", "9.x"]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure bazel caches
        run: |
          echo "common --disk_cache=${HOME}/.cache/bazel-disk" >> ~/.bazelrc
          echo "common --repository_cache=${HOME}/.cache/bazel-repo" >> ~/.bazelrc
      - name: Restore bazel caches
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/bazelisk
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ runner.os }}-bazel-${{ matrix.bazel }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.bazel }}-
      - name: bazel test
        run: make test
      # Pull requests only restore so they can't evict the caches main relies on.
      - name: Save bazel caches
        if: github.ref == 'refs/heads/main' && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/bazelisk
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
